<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1.618 // Node</title>
  <style>
    :root {
      --bg: #07070b;
      --panel: #0e0f17;
      --panel-2: #141622;
      --border: #23273a;
      --text: #eef1ff;
      --muted: #8b92b2;
      --accent: #ff2a55;
      --accent-2: #7c4dff;
      --cyan: #00e5ff;
      --ok: #00e676;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    body {
      background: radial-gradient(circle at top, #141226 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .shell {
      width: 100%;
      max-width: 460px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .badge {
      color: var(--cyan);
      letter-spacing: 1px;
      font-weight: 700;
    }

    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .btn:hover { border-color: var(--cyan); }
    .btn-accent {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      color: #fff;
      font-weight: 700;
    }
    .btn-danger {
      border-color: rgba(255, 42, 85, 0.5);
      color: #ff6b88;
    }
    .btn-danger:hover { background: rgba(255, 42, 85, 0.15); }

    /* Calculator Decoy */
    .calc-wrap { padding: 18px; }
    .calc-screen {
      background: #050508;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-align: right;
      margin-bottom: 14px;
    }
    .calc-expr { font-size: 12px; color: var(--muted); min-height: 16px; }
    .calc-val { font-size: 28px; font-weight: 700; margin-top: 4px; word-break: break-all; }
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .key {
      padding: 15px 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .key:active { transform: scale(0.97); }
    .key-op { color: var(--cyan); }
    .key-eq { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: #fff; }

    /* Auth / Room Setup */
    .view { display: none; padding: 18px; }
    .view.active { display: block; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.7px; }
    input, select {
      width: 100%;
      background: #07080d;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--cyan); }

    /* Chat View */
    .chat-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .messages {
      height: 330px;
      overflow-y: auto;
      background: #06070c;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .msg {
      background: var(--panel-2);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.4;
    }
    .msg.mine { border-left: 3px solid var(--cyan); }
    .msg-head {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .msg-sender { color: var(--cyan); font-weight: 700; }
    .composer {
      display: flex;
      gap: 8px;
    }
    .composer input { flex: 1; }
    .status-note { font-size: 11px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <span class="badge" id="headerBadge">CALC // 1.0</span>
      <div style="display:flex; gap:6px;">
        <button class="btn" id="lockBtn" title="Lock to Calculator">LOCK</button>
        <button class="btn btn-danger" id="panicBtn" title="Panic Exit">PANIC</button>
      </div>
    </div>

    <!-- 1. DECOY CALCULATOR -->
    <div class="view active" id="calcView">
      <div class="calc-wrap">
        <div class="calc-screen">
          <div class="calc-expr" id="calcExpr"></div>
          <div class="calc-val" id="calcVal">0</div>
        </div>
        <div class="calc-grid" id="calcGrid"></div>
      </div>
    </div>

    <!-- 2. ROOM & CALLSIGN UNLOCK -->
    <div class="view" id="authView">
      <h3 style="margin-bottom:12px; font-size:15px; color:var(--cyan);">ENCRYPTED NODE ACCESS</h3>
      <div class="field">
        <label>Your Callsign (Name)</label>
        <input type="text" id="callsignInput" placeholder="e.g. kalah" maxlength="24" />
      </div>
      <div class="field">
        <label>Room ID</label>
        <input type="text" id="roomInput" placeholder="e.g. phi-sector-01" maxlength="40" />
      </div>
      <div class="field">
        <label>Shared Secret Passcode (AES-256-GCM)</label>
        <input type="password" id="passInput" placeholder="Strong shared key" />
      </div>
      <button class="btn btn-accent" style="width:100%; padding:11px;" id="enterRoomBtn">ENTER CHANNEL</button>
      <p class="status-note" id="authStatus">Encryption runs locally in your browser via Web Crypto API.</p>
    </div>

    <!-- 3. ENCRYPTED CHAT -->
    <div class="view" id="chatView">
      <div class="chat-meta">
        <span id="roomLabel">ROOM: -</span>
        <div style="display:flex; gap:6px; align-items:center;">
          <select id="ttlSelect" style="width:auto; padding:4px 8px; font-size:11px;">
            <option value="0">TTL: Off</option>
            <option value="30">TTL: 30s</option>
            <option value="120" selected>TTL: 2m</option>
            <option value="600">TTL: 10m</option>
          </select>
          <button class="btn btn-danger" id="nukeBtn" style="padding:5px 9px; font-size:11px;">NUKE</button>
        </div>
      </div>

      <div class="messages" id="messagesBox"></div>

      <form class="composer" id="sendForm">
        <input type="text" id="msgInput" placeholder="Transmit encrypted message..." autocomplete="off" required />
        <button class="btn btn-accent" type="submit">SEND</button>
      </form>
      <p class="status-note" id="chatStatus"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildRemoved, remove, set } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDyVqsqYbsVr0ffvo_lUThdSHR6DlAV-2M",
      databaseURL: "https://kalah-private-node-default-rtdb.asia-southeast1.firebasedatabase.app",
      storageBucket: "kalah-private-node.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- UI NAVIGATION ---
    const views = {
      calc: document.getElementById("calcView"),
      auth: document.getElementById("authView"),
      chat: document.getElementById("chatView")
    };
    const headerBadge = document.getElementById("headerBadge");

    function showView(name) {
      Object.values(views).forEach(v => v.classList.remove("active"));
      views[name].classList.add("active");
      headerBadge.textContent = name === "calc" ? "CALC // 1.0" : name === "auth" ? "AUTH // GATE" : "LINK // ACTIVE";
    }

    document.getElementById("lockBtn").addEventListener("click", () => showView("calc"));
    document.getElementById("panicBtn").addEventListener("click", () => {
      window.location.replace("https://www.google.com");
    });

    // --- CALCULATOR DECOY (1.618=) ---
    const calcExprEl = document.getElementById("calcExpr");
    const calcValEl = document.getElementById("calcVal");
    const calcGrid = document.getElementById("calcGrid");
    let expr = "";
    let rawSeq = "";

    const keys = [
      "C", "(", ")", "/",
      "7", "8", "9", "*",
      "4", "5", "6", "-",
      "1", "2", "3", "+",
      ".", "0", "⌫", "="
    ];

    keys.forEach(k => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = k;
      btn.className = "key";
      if (["/", "*", "-", "+", "(", ")", "C", "⌫"].includes(k)) btn.classList.add("key-op");
      if (k === "=") btn.classList.add("key-eq");
      btn.addEventListener("click", () => handleCalcKey(k));
      calcGrid.appendChild(btn);
    });

    function handleCalcKey(k) {
      if (k === "C") {
        expr = "";
        rawSeq = "";
        calcExprEl.textContent = "";
        calcValEl.textContent = "0";
        return;
      }
      if (k === "⌫") {
        expr = expr.slice(0, -1);
        rawSeq = rawSeq.slice(0, -1);
        calcValEl.textContent = expr || "0";
        return;
      }
      if (k === "=") {
        const cleanSeq = rawSeq.replace(/\s+/g, "");
        if (cleanSeq.endsWith("1.618=") || cleanSeq.endsWith("1618=")) {
          expr = "";
          rawSeq = "";
          calcExprEl.textContent = "";
          calcValEl.textContent = "0";
          showView("auth");
          return;
        }
        try {
          if (!/^[0-9+\-*/().\s]+$/.test(expr)) throw new Error("Invalid");
          const result = Function(`"use strict"; return (${expr})`)();
          calcExprEl.textContent = expr + " =";
          calcValEl.textContent = String(result);
          expr = String(result);
          rawSeq = "";
        } catch {
          calcValEl.textContent = "ERR";
          expr = "";
          rawSeq = "";
        }
        return;
      }
      expr += k;
      rawSeq += k;
      calcValEl.textContent = expr;
    }

    // --- CLIENT-SIDE AES-256-GCM ---
    async function deriveKey(passcode, saltHex) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(passcode),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const salt = new Uint8Array(saltHex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    function bufToB64(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)));
    }
    function b64ToBuf(b64) {
      return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    }

    async function encryptPayload(plainText, passcode, roomId) {
      const saltHex = Array.from(new TextEncoder().encode(roomId.padEnd(16, "0").slice(0, 16)))
        .map(b => b.toString(16).padStart(2, "0")).join("");
      const key = await deriveKey(passcode, saltHex);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const cipher = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        new TextEncoder().encode(plainText)
      );
      return { iv: bufToB64(iv), ct: bufToB64(cipher) };
    }

    async function decryptPayload(packet, passcode, roomId) {
      const saltHex = Array.from(new TextEncoder().encode(roomId.padEnd(16, "0").slice(0, 16)))
        .map(b => b.toString(16).padStart(2, "0")).join("");
      const key = await deriveKey(passcode, saltHex);
      const plainBuf = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBuf(packet.iv) },
        key,
        b64ToBuf(packet.ct)
      );
      return new TextDecoder().decode(plainBuf);
    }

    // --- ROOM & CHAT LOGIC ---
    let currentCallsign = "";
    let currentRoom = "";
    let currentPass = "";
    let roomRef = null;
    const messagesBox = document.getElementById("messagesBox");
    const chatStatus = document.getElementById("chatStatus");

    document.getElementById("enterRoomBtn").addEventListener("click", async () => {
      const callsign = document.getElementById("callsignInput").value.trim();
      const room = document.getElementById("roomInput").value.trim().replace(/[.#$[\]/]/g, "_");
      const pass = document.getElementById("passInput").value;
      const authStatus = document.getElementById("authStatus");

      if (!callsign || !room || !pass) {
        authStatus.textContent = "Callsign, Room ID, and Passcode are required.";
        return;
      }

      currentCallsign = callsign;
      currentRoom = room;
      currentPass = pass;
      messagesBox.innerHTML = "";
      document.getElementById("roomLabel").textContent = `ROOM: ${currentRoom} // @${currentCallsign}`;
      showView("chat");
      startRoomListener();
    });

    function startRoomListener() {
      roomRef = ref(db, `rooms/${currentRoom}/messages`);
      onChildAdded(roomRef, async (snap) => {
        const data = snap.val();
        if (!data) return;

        // Auto-delete check
        if (data.expiresAt && Date.now() > data.expiresAt) {
          remove(ref(db, `rooms/${currentRoom}/messages/${snap.key}`));
          return;
        }

        try {
          const sender = await decryptPayload(data.senderEnc, currentPass, currentRoom);
          const text = await decryptPayload(data.bodyEnc, currentPass, currentRoom);
          renderMessage(snap.key, sender, text, data.ts, sender === currentCallsign, data.expiresAt);
        } catch {
          renderMessage(snap.key, "UNKNOWN", "[Decryption failed — check passcode]", data.ts, false, data.expiresAt);
        }
      });

      onChildRemoved(roomRef, (snap) => {
        const el = document.getElementById(`msg-${snap.key}`);
        if (el) el.remove();
      });
    }

    function renderMessage(id, sender, text, ts, isMine, expiresAt) {
      if (document.getElementById(`msg-${id}`)) return;
      const div = document.createElement("div");
      div.id = `msg-${id}`;
      div.className = `msg ${isMine ? "mine" : ""}`;

      const timeStr = new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      div.innerHTML = `
        <div class="msg-head">
          <span class="msg-sender">@${escapeHtml(sender)}</span>
          <span>${timeStr}</span>
        </div>
        <div>${escapeHtml(text)}</div>
      `;
      messagesBox.appendChild(div);
      messagesBox.scrollTop = messagesBox.scrollHeight;

      if (expiresAt) {
        const delay = Math.max(0, expiresAt - Date.now());
        setTimeout(() => {
          remove(ref(db, `rooms/${currentRoom}/messages/${id}`)).catch(() => {});
        }, delay);
      }
    }

    document.getElementById("sendForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("msgInput");
      const plain = input.value.trim();
      if (!plain || !roomRef) return;

      const ttlSec = parseInt(document.getElementById("ttlSelect").value, 10);
      const now = Date.now();
      const expiresAt = ttlSec > 0 ? now + ttlSec * 1000 : null;

      try {
        const senderEnc = await encryptPayload(currentCallsign, currentPass, currentRoom);
        const bodyEnc = await encryptPayload(plain, currentPass, currentRoom);
        await push(roomRef, {
          senderEnc,
          bodyEnc,
          ts: now,
          expiresAt
        });
        input.value = "";
        chatStatus.textContent = ttlSec > 0 ? `Encrypted & sent (auto-delete in ${ttlSec}s).` : "Encrypted & sent.";
      } catch (err) {
        chatStatus.textContent = "Send error: " + err.message;
      }
    });

    document.getElementById("nukeBtn").addEventListener("click", async () => {
      if (!currentRoom) return;
      await set(ref(db, `rooms/${currentRoom}`), null);
      messagesBox.innerHTML = "";
      chatStatus.textContent = "Room nuked.";
    });

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }
  </script>
</body>
</html>
