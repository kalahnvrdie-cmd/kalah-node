<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalah — Full Low-Data Private Vault</title>
  <style>
    :root {
      --bg: #080507;
      --panel: #130a0e;
      --panel-2: #1c0e14;
      --panel-3: #26121b;
      --red: #e11d48;
      --red-2: #be123c;
      --red-dark: #881337;
      --text: #f9fafb;
      --muted: #a1a1aa;
      --border: rgba(225, 29, 72, 0.3);
      --ok: #22c55e;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1b0910 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .app-shell {
      width: 100%;
      max-width: 460px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.75);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #ff4d6d;
      font-size: 15px;
    }

    .status-pill {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(225, 29, 72, 0.16);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #0d0609;
      border-bottom: 1px solid var(--border);
    }

    .nav-tab {
      padding: 10px 6px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .nav-tab.active {
      color: #ff6b86;
      border-bottom-color: var(--red);
      background: rgba(225, 29, 72, 0.08);
    }

    .view { display: none; padding: 13px; }
    .view.active { display: block; }

    .calc-screen {
      background: #060305;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      text-align: right;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      min-height: 62px;
      word-break: break-all;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    button.primary {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      border: none;
    }

    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    button:active { transform: scale(0.98); }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0508;
      color: var(--text);
      margin-bottom: 9px;
      font-size: 13px;
    }

    .card {
      background: #0e070a;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 11px;
    }

    .friend-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 11px;
      border-radius: 10px;
      background: var(--panel-2);
      margin-top: 7px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .friend-item:hover, .friend-item.selected {
      border-color: var(--red);
      background: var(--panel-3);
    }

    .messages-box {
      height: 230px;
      overflow-y: auto;
      background: #080406;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px;
      margin-bottom: 9px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .msg {
      padding: 8px 11px;
      border-radius: 11px;
      max-width: 84%;
      font-size: 13px;
      line-height: 1.38;
      background: var(--panel-2);
    }

    .msg.me {
      align-self: flex-end;
      background: rgba(225, 29, 72, 0.28);
      border: 1px solid var(--border);
    }

    .msg-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      text-align: right;
    }

    .notice {
      font-size: 12px;
      padding: 9px 11px;
      border-radius: 10px;
      margin: 10px 13px 0;
      background: rgba(225, 29, 72, 0.17);
      border: 1px solid var(--red);
      display: none;
      word-break: break-word;
    }

    .row { display: flex; gap: 8px; align-items: center; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .small { font-size: 12px; color: var(--muted); }
    .badge-status {
      font-size: 11px;
      color: #fda4af;
      background: rgba(225, 29, 72, 0.14);
      padding: 3px 8px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand">KALAH // VAULT PRO</div>
      <div class="row">
        <span class="status-pill" id="netBadge">Checking...</span>
        <button class="ghost" onclick="lockApp()" style="padding:5px 9px; font-size:11px;">Lock</button>
      </div>
    </div>

    <div id="noticeBox" class="notice"></div>

    <!-- 1. Calculator Lock Screen -->
    <div id="calcView" class="view active">
      <div class="calc-screen" id="calcDisplay">0</div>
      <div class="calc-grid">
        <button onclick="calcClear()">C</button>
        <button onclick="calcAppend('(')">(</button>
        <button onclick="calcAppend(')')">)</button>
        <button onclick="calcAppend('/')">/</button>

        <button onclick="calcAppend('7')">7</button>
        <button onclick="calcAppend('8')">8</button>
        <button onclick="calcAppend('9')">9</button>
        <button onclick="calcAppend('*')">*</button>

        <button onclick="calcAppend('4')">4</button>
        <button onclick="calcAppend('5')">5</button>
        <button onclick="calcAppend('6')">6</button>
        <button onclick="calcAppend('-')">-</button>

        <button onclick="calcAppend('1')">1</button>
        <button onclick="calcAppend('2')">2</button>
        <button onclick="calcAppend('3')">3</button>
        <button onclick="calcAppend('+')">+</button>

        <button onclick="calcAppend('0')">0</button>
        <button onclick="calcAppend('.')">.</button>
        <button onclick="calcBackspace()">⌫</button>
        <button class="primary" onclick="calcEquals()">=</button>
      </div>
      <p class="small" style="margin-top:10px; text-align:center;">
        Enter <b>1.618=</b> to open vault
      </p>
    </div>

    <!-- 2. Main Vault Container -->
    <div id="vaultView" class="view" style="padding:0;">
      <div class="nav-tabs">
        <div class="nav-tab active" id="tabChat" onclick="switchTab('chat')">Chat</div>
        <div class="nav-tab" id="tabFriends" onclick="switchTab('friends')">Friends</div>
        <div class="nav-tab" id="tabProfile" onclick="switchTab('profile')">Profile & Status</div>
      </div>

      <!-- Tab A: Active Chat -->
      <div id="panelChat" class="view active">
        <div class="card" id="noChatCard">
          <div class="between">
            <div>
              <strong id="chatHeaderTitle">No chat selected</strong>
              <div class="small" id="friendStatusLine">Select a friend from Friends tab</div>
            </div>
            <span class="small" id="queueCountText">Queue: 0</span>
          </div>
        </div>

        <div class="card" id="activeChatCard" style="display:none;">
          <div class="between" style="margin-bottom:8px;">
            <div>
              <strong id="activeChatName">Friend</strong>
              <div class="small" id="activeFriendStatusText">Status: ...</div>
            </div>
            <button class="ghost" style="padding:6px 9px; font-size:11px;" onclick="refreshActiveFriendStatus()">
              Check Status
            </button>
          </div>

          <div class="messages-box" id="messagesBox"></div>

          <div class="row">
            <input id="msgInput" type="text" placeholder="Type message (low-data)..." style="margin-bottom:0;" onkeydown="if(event.key==='Enter') sendMessage()" />
            <button class="primary" onclick="sendMessage()">Send</button>
          </div>
        </div>

        <div class="row">
          <button onclick="syncQueue()" style="flex:1; font-size:12px;">Sync Queue</button>
          <button class="ghost" onclick="showNotice('')" style="font-size:12px;">Clear Notice</button>
        </div>
      </div>

      <!-- Tab B: Friends -->
      <div id="panelFriends" class="view">
        <div class="card">
          <label class="small">Add Friend (ID / Email / Phone)</label>
          <input id="friendInput" type="text" placeholder="e.g. U-4VXXG9" onkeydown="if(event.key==='Enter') addFriend()" />
          <button class="primary" style="width:100%;" onclick="addFriend()">Find & Add Friend</button>
        </div>

        <div class="card">
          <input id="friendSearch" type="text" placeholder="Search saved friends..." oninput="renderFriends()" />
          <div id="friendsList"></div>
        </div>
      </div>

      <!-- Tab C: Profile & Status -->
      <div id="panelProfile" class="view">
        <div class="card">
          <div class="between" style="margin-bottom:8px;">
            <div>
              <div class="small">Your ID</div>
              <strong id="myIdText">U-LOADING</strong>
            </div>
            <span class="badge-status" id="myCurrentStatusBadge">Online</span>
          </div>

          <label class="small">Display Name</label>
          <input id="profileNameInput" type="text" placeholder="e.g. Kalah" />

          <label class="small">Status Preset</label>
          <select id="statusPresetSelect" onchange="applyPresetToInput()">
            <option value="Online">Online</option>
            <option value="Study Mode (A/L)">Study Mode (A/L)</option>
            <option value="Coding / Building">Coding / Building</option>
            <option value="Busy">Busy</option>
            <option value="Offline / Rest">Offline / Rest</option>
          </select>

          <label class="small">Custom Status Text</label>
          <input id="statusTextInput" type="text" placeholder="Short status..." />

          <button class="primary" style="width:100%;" onclick="saveProfileAndStatus()">
            Save & Publish Status (Low-Data)
          </button>
        </div>

        <div class="card">
          <div class="small" style="margin-bottom:8px;">Storage & Cache</div>
          <div class="row">
            <button class="ghost" style="flex:1; font-size:12px;" onclick="clearMessageCache()">Clear Chat Cache</button>
            <button class="ghost" style="flex:1; font-size:12px;" onclick="resetMyId()">New ID</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCaxXFQEMKZ9oHknXWh32-gBgI_OI8iPII",
      authDomain: "kalah-chat-app.firebaseapp.com",
      databaseURL: "https://kalah-chat-app-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kalah-chat-app",
      storageBucket: "kalah-chat-app.firebasestorage.app",
      messagingSenderId: "723700154314",
      appId: "1:723700154314:web:b3768c6231f6e310a41933",
      measurementId: "G-L6FY0HFFLC"
    };

    const KEYS = {
      myId: "kalah_pro_my_id_v1",
      profile: "kalah_pro_profile_v1",
      friends: "kalah_pro_friends_v1",
      queue: "kalah_pro_queue_v1",
      msgPrefix: "kalah_pro_msgs_"
    };

    let db = null;
    let activeFriend = null;
    let activeMsgRef = null;
    let calcExpr = "";

    function showNotice(msg) {
      const box = document.getElementById("noticeBox");
      if (!msg) {
        box.style.display = "none";
        box.textContent = "";
        return;
      }
      box.textContent = msg;
      box.style.display = "block";
    }

    function updateNetBadge() {
      const badge = document.getElementById("netBadge");
      badge.textContent = navigator.onLine ? "Online" : "Offline";
    }

    function loadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJson(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }

    function getMyId(forceNew = false) {
      let id = localStorage.getItem(KEYS.myId);
      if (!id || forceNew) {
        const rand = Math.random().toString(36).substring(2, 8).toUpperCase();
        id = "U-" + rand;
        localStorage.setItem(KEYS.myId, id);
      }
      return id;
    }

    function getProfile() {
      return loadJson(KEYS.profile, {
        name: "Kalah",
        status: "Online",
        updatedAt: Date.now()
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function safeKey(str) {
      return encodeURIComponent(String(str).trim()).replaceAll(".", "%2E");
    }

    function makeRoomId(a, b) {
      return [safeKey(a), safeKey(b)].sort().join("__");
    }

    function formatTime(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function updateQueueCounter() {
      const q = loadJson(KEYS.queue, []);
      document.getElementById("queueCountText").textContent = "Queue: " + q.length;
    }

    function initFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        db = firebase.database();
        showNotice("");
      } catch (err) {
        showNotice("Firebase Init (" + (err.code || "err") + "): " + err.message);
      }
    }

    // Calculator Vault
    function calcAppend(ch) {
      if (calcExpr === "0" && ch !== ".") calcExpr = "";
      calcExpr += ch;
      document.getElementById("calcDisplay").textContent = calcExpr || "0";
    }

    function calcClear() {
      calcExpr = "";
      document.getElementById("calcDisplay").textContent = "0";
    }

    function calcBackspace() {
      calcExpr = calcExpr.slice(0, -1);
      document.getElementById("calcDisplay").textContent = calcExpr || "0";
    }

    function calcEquals() {
      if (calcExpr.trim() === "1.618") {
        calcClear();
        document.getElementById("calcView").classList.remove("active");
        document.getElementById("vaultView").classList.add("active");
        hydrateProfileUi();
        renderFriends();
        updateQueueCounter();
        syncQueue();
        return;
      }
      try {
        if (!/^[0-9+\-*/().\s]+$/.test(calcExpr)) return;
        const result = Function('"use strict";return (' + calcExpr + ")")();
        calcExpr = String(result);
        document.getElementById("calcDisplay").textContent = calcExpr;
      } catch {
        document.getElementById("calcDisplay").textContent = "Error";
        calcExpr = "";
      }
    }

    function lockApp() {
      if (activeMsgRef) {
        activeMsgRef.off();
        activeMsgRef = null;
      }
      activeFriend = null;
      document.getElementById("activeChatCard").style.display = "none";
      document.getElementById("noChatCard").style.display = "block";
      document.getElementById("vaultView").classList.remove("active");
      document.getElementById("calcView").classList.add("active");
    }

    function switchTab(tab) {
      ["chat", "friends", "profile"].forEach((t) => {
        document.getElementById("tab" + t[0].toUpperCase() + t.slice(1)).classList.toggle("active", t === tab);
        document.getElementById("panel" + t[0].toUpperCase() + t.slice(1)).classList.toggle("active", t === tab);
      });
    }

    // Profile & Status
    function hydrateProfileUi() {
      const p = getProfile();
      document.getElementById("myIdText").textContent = getMyId();
      document.getElementById("profileNameInput").value = p.name || "";
      document.getElementById("statusTextInput").value = p.status || "Online";
      document.getElementById("myCurrentStatusBadge").textContent = p.status || "Online";
    }

    function applyPresetToInput() {
      const val = document.getElementById("statusPresetSelect").value;
      document.getElementById("statusTextInput").value = val;
    }

    async function saveProfileAndStatus() {
      const name = document.getElementById("profileNameInput").value.trim() || "Kalah";
      const status = document.getElementById("statusTextInput").value.trim() || "Online";
      const profileObj = { name, status, updatedAt: Date.now() };

      saveJson(KEYS.profile, profileObj);
      document.getElementById("myCurrentStatusBadge").textContent = status;

      if (!db || !navigator.onLine) {
        enqueueAction({ type: "setProfile", userId: getMyId(), profileObj });
        showNotice("Offline: Status local එකේ save වුණා.");
        return;
      }

      try {
        await db.ref(`users/${safeKey(getMyId())}/profile`).set(profileObj);
        showNotice("Profile & Status update වුණා.");
      } catch (err) {
        enqueueAction({ type: "setProfile", userId: getMyId(), profileObj });
        showNotice("Status Save Error (" + (err.code || "err") + "): " + err.message);
      }
    }

    // Friends
    function renderFriends() {
      const q = (document.getElementById("friendSearch").value || "").trim().toLowerCase();
      const friends = loadJson(KEYS.friends, []).filter((f) => f.toLowerCase().includes(q));
      const box = document.getElementById("friendsList");

      if (!friends.length) {
        box.innerHTML = '<p class="small" style="margin-top:8px;">No matching friends.</p>';
        return;
      }

      box.innerHTML = friends
        .map((f) => {
          const sel = activeFriend === f ? "selected" : "";
          return `<div class="friend-item ${sel}" onclick="selectFriendAndOpenChat('${encodeURIComponent(f)}')">
            <div>
              <strong>${escapeHtml(f)}</strong>
              <div class="small">Tap to chat</div>
            </div>
            <span class="badge-status">Open</span>
          </div>`;
        })
        .join("");
    }

    async function addFriend() {
      const input = document.getElementById("friendInput");
      const target = input.value.trim();
      if (!target) {
        showNotice("Friend ID / Email / Phone එකක් දාන්න.");
        return;
      }

      const friends = loadJson(KEYS.friends, []);
      if (!friends.includes(target)) {
        friends.push(target);
        saveJson(KEYS.friends, friends);
      }
      input.value = "";
      renderFriends();

      if (!db || !navigator.onLine) {
        enqueueAction({ type: "addFriend", from: getMyId(), target });
        showNotice("Offline: Friend local list එකේ add වුණා.");
        return;
      }

      try {
        await db.ref(`users/${safeKey(getMyId())}/friends/${safeKey(target)}`).set(true);
        showNotice("");
        selectFriendAndOpenChat(encodeURIComponent(target));
      } catch (err) {
        enqueueAction({ type: "addFriend", from: getMyId(), target });
        showNotice("Add Friend Error (" + (err.code || "err") + "): " + err.message);
      }
    }

    function selectFriendAndOpenChat(encodedFriend) {
      const friend = decodeURIComponent(encodedFriend);
      activeFriend = friend;
      switchTab("chat");
      renderFriends();

      document.getElementById("noChatCard").style.display = "none";
      document.getElementById("activeChatCard").style.display = "block";
      document.getElementById("activeChatName").textContent = friend;
      document.getElementById("activeFriendStatusText").textContent = "Status: checking...";

      const roomId = makeRoomId(getMyId(), friend);
      const cacheKey = KEYS.msgPrefix + roomId;
      renderMessages(loadJson(cacheKey, []));

      if (activeMsgRef) {
        activeMsgRef.off();
      }

      if (db && navigator.onLine) {
        refreshActiveFriendStatus();
        activeMsgRef = db.ref(`chats/${roomId}/messages`).limitToLast(25);
        activeMsgRef.on(
          "value",
          (snap) => {
            const arr = Object.values(snap.val() || {}).sort((a, b) => (a.ts || 0) - (b.ts || 0));
            saveJson(cacheKey, arr);
            renderMessages(arr);
          },
          (err) => {
            showNotice("Chat Read Error (" + (err.code || "err") + "): " + err.message);
          }
        );
      } else {
        document.getElementById("activeFriendStatusText").textContent = "Status: cached / offline";
      }
    }

    // Low-data one-time status check for active friend only
    async function refreshActiveFriendStatus() {
      if (!activeFriend || !db) return;
      try {
        const snap = await db.ref(`users/${safeKey(activeFriend)}/profile`).once("value");
        const prof = snap.val();
        if (prof && prof.status) {
          const t = prof.updatedAt ? ` · ${formatTime(prof.updatedAt)}` : "";
          document.getElementById("activeFriendStatusText").textContent = `Status: ${prof.status}${t}`;
        } else {
          document.getElementById("activeFriendStatusText").textContent = "Status: No status set";
        }
      } catch (err) {
        document.getElementById("activeFriendStatusText").textContent = "Status: unavailable";
        showNotice("Status Check Error (" + (err.code || "err") + "): " + err.message);
      }
    }

    function renderMessages(msgs) {
      const box = document.getElementById("messagesBox");
      const myId = getMyId();
      if (!msgs.length) {
        box.innerHTML = '<div class="small">No messages yet.</div>';
        return;
      }
      box.innerHTML = msgs
        .map((m) => {
          const isMe = m.sender === myId;
          return `<div class="msg ${isMe ? "me" : ""}">
            <div>${escapeHtml(m.text)}</div>
            <div class="msg-meta">${formatTime(m.ts)}</div>
          </div>`;
        })
        .join("");
      box.scrollTop = box.scrollHeight;
    }

    function enqueueAction(item) {
      const q = loadJson(KEYS.queue, []);
      q.push(item);
      saveJson(KEYS.queue, q);
      updateQueueCounter();
    }

    async function sendMessage() {
      if (!activeFriend) return;
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      const myId = getMyId();
      const roomId = makeRoomId(myId, activeFriend);
      const msgObj = { sender: myId, text, ts: Date.now() };

      const cacheKey = KEYS.msgPrefix + roomId;
      const cached = loadJson(cacheKey, []);
      cached.push(msgObj);
      saveJson(cacheKey, cached.slice(-40));
      renderMessages(cached);
      input.value = "";

      if (!db || !navigator.onLine) {
        enqueueAction({ type: "sendMsg", roomId, msgObj });
        showNotice("Offline: Message queue එකේ save වුණා.");
        return;
      }

      try {
        await db.ref(`chats/${roomId}/messages`).push(msgObj);
        showNotice("");
      } catch (err) {
        enqueueAction({ type: "sendMsg", roomId, msgObj });
        showNotice("Send Error (" + (err.code || "err") + "): " + err.message);
      }
    }

    async function syncQueue() {
      updateQueueCounter();
      if (!db || !navigator.onLine) return;

      const q = loadJson(KEYS.queue, []);
      if (!q.length) return;

      const remaining = [];
      for (const item of q) {
        try {
          if (item.type === "sendMsg") {
            await db.ref(`chats/${item.roomId}/messages`).push(item.msgObj);
          } else if (item.type === "addFriend") {
            await db.ref(`users/${safeKey(item.from)}/friends/${safeKey(item.target)}`).set(true);
          } else if (item.type === "setProfile") {
            await db.ref(`users/${safeKey(item.userId)}/profile`).set(item.profileObj);
          }
        } catch {
          remaining.push(item);
        }
      }
      saveJson(KEYS.queue, remaining);
      updateQueueCounter();
    }

    function clearMessageCache() {
      Object.keys(localStorage)
        .filter((k) => k.startsWith(KEYS.msgPrefix))
        .forEach((k) => localStorage.removeItem(k));
      if (activeFriend) {
        renderMessages([]);
      }
      showNotice("Chat cache clear කළා.");
    }

    function resetMyId() {
      getMyId(true);
      hydrateProfileUi();
      showNotice("අලුත් ID එකක් හැදුණා: " + getMyId());
    }

    window.addEventListener("online", () => {
      updateNetBadge();
      syncQueue();
    });
    window.addEventListener("offline", updateNetBadge);

    updateNetBadge();
    initFirebase();
  </script>
</body>
</html>
