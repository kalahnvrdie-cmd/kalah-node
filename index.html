<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    :root {
      --bg: #05060a;
      --surface: rgba(16, 19, 30, 0.88);
      --surface-2: rgba(25, 29, 45, 0.92);
      --surface-hover: rgba(36, 42, 64, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f5ff;
      --muted: #8e96b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --danger: #ff2e55;
      --cyan: #22d3ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, ui-monospace, monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(59, 130, 246, 0.14), transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.12), transparent 45%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .device {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .bar-title {
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--text);
    }

    .bar-actions {
      display: flex;
      gap: 8px;
    }

    .pill-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .pill-btn:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .pill-panic {
      color: #ff758f;
      border-color: rgba(255, 46, 85, 0.35);
      background: rgba(255, 46, 85, 0.1);
    }

    .view {
      display: none;
      padding: 18px;
    }

    .view.active {
      display: block;
    }

    /* Professional Calculator */
    .display {
      background: rgba(5, 6, 10, 0.75);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px;
      text-align: right;
      margin-bottom: 16px;
      min-height: 104px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .history {
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .output {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1.15;
      word-break: break-all;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 11px;
    }

    .k {
      height: 58px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .k:hover {
      background: var(--surface-hover);
    }

    .k:active {
      transform: scale(0.95);
    }

    .k-fn {
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.2);
    }

    .k-op {
      color: var(--cyan);
      font-weight: 600;
    }

    .k-eq {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border: none;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 10px 24px var(--accent-glow);
    }

    /* Secret Node Auth */
    .node-head {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--cyan);
      margin-bottom: 14px;
    }

    .group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      background: rgba(5, 6, 10, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 13px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--cyan);
    }

    .primary-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      cursor: pointer;
      margin-top: 4px;
    }

      display: flex;
      align-items: center;
      justify-content: space-between
